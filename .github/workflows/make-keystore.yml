name: Make debug keystore

# One-off helper: creates the debug signing key used by every mobile build so a
# new APK upgrades the installed app instead of failing with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE. Download the artifact once, then add
# keystore.b64 and the password as repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Generate debug keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate
        run: |
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          keytool -genkeypair -v \
            -keystore qwaudio-debug.keystore \
            -alias qwaudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Qwen Audio Agent Debug, O=Personal, C=US"
          base64 -w0 qwaudio-debug.keystore > keystore.b64
          echo "PASSWORD=$PASSWORD" > keystore-password.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-keystore
          path: |
            keystore.b64
            keystore-password.txt
          if-no-files-found: error
